<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder Pro Max | Software Engineer Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Font Library */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600;700&family=PT+Serif:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0e14; 
            color: #f1f5f9; 
            overflow: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Light Mode Styles */
        body.light-mode {
            background-color: #e0f2fe;
            color: #0c4a6e;
        }
        
        body.light-mode .bg-\[\#020617\] { background-color: #f0f9ff; }
        body.light-mode .bg-\[\#1e293b\] { background-color: #e0f2fe; }
        body.light-mode .bg-\[\#0b0d11\] { background-color: #f0f9ff; }
        body.light-mode .bg-\[\#1a1f2e\] { background-color: #e0f2fe; }
        body.light-mode .bg-slate-900 { background-color: #bae6fd; }
        body.light-mode .bg-slate-800 { background-color: #7dd3fc; }
        body.light-mode .bg-slate-700 { background-color: #38bdf8; }
        body.light-mode .text-slate-500 { color: #0c4a6e; }
        body.light-mode .text-slate-400 { color: #075985; }
        body.light-mode .text-slate-300 { color: #0284c7; }
        body.light-mode .text-slate-200 { color: #0369a1; }
        body.light-mode .text-white { color: #0c4a6e; }
        body.light-mode .border-slate-800 { border-color: #7dd3fc; }
        body.light-mode .border-slate-700 { border-color: #38bdf8; }
        body.light-mode .border-slate-600 { border-color: #0284c7; }
        
        /* Form inputs and other elements */
        body.light-mode .form-input {
            background-color: #f0f9ff;
            color: #0c4a6e;
            border-color: #7dd3fc;
        }
        
        body.light-mode .form-label {
            color: #075985;
        }
        
        body.light-mode .bg-white\/10 {
            background-color: rgba(240, 249, 255, 0.9);
        }
        
        body.light-mode .bg-white\/5 {
            background-color: rgba(240, 249, 255, 0.95);
        }
        
        body.light-mode .text-white\/60 {
            color: #0284c7;
        }
        
        body.light-mode .text-white\/70 {
            color: #0369a1;
        }
        
        body.light-mode .hover\:text-white:hover {
            color: #0c4a6e;
        }
        
        /* Modal and overlay styles */
        body.light-mode .bg-slate-950\/90 {
            background-color: rgba(14, 165, 233, 0.9);
        }
        
        body.light-mode .bg-gradient-to-br.from-\[\#11141b\].to-\[\#1e293b\] {
            background: linear-gradient(to bottom right, #f0f9ff, #e0f2fe);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* Profile Delete Buttons */
        #profile-delete-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        
        #profile-delete-buttons button {
            padding: 4px 8px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        #profile-delete-buttons button:hover {
            background: #b91c1c;
        }

        /* Dynamic Resume Print Variables */
        :root {
            --color-primary: #4f46e5;
            --color-primary-light: rgba(79, 70, 229, 0.08);
            --color-text: #374151;
            --color-heading: #111827;
            --font-heading: 'Merriweather', serif;
            --font-body: 'Inter', sans-serif;
            --base-font-size: 14px;
            --base-line-height: 1.6;
        }

        /* Font */
        .font-merriweather { --font-heading: 'Merriweather', serif; --font-body: 'Inter', sans-serif; }
        .font-inter { --font-heading: 'Inter', sans-serif; --font-body: 'Inter', sans-serif; }
        .font-playfair { --font-heading: 'Playfair Display', serif; --font-body: 'Lora', serif; }
        .font-lora { --font-heading: 'Lora', serif; --font-body: 'Inter', sans-serif; }
        .font-roboto { --font-heading: 'Roboto', sans-serif; --font-body: 'Roboto', sans-serif; }
        .font-montserrat { --font-heading: 'Montserrat', sans-serif; --font-body: 'Inter', sans-serif; }
        .font-open-sans { --font-heading: 'Open Sans', sans-serif; --font-body: 'Open Sans', sans-serif; }
        .font-source-code { --font-heading: 'Source Code Pro', monospace; --font-body: 'Source Sans Pro', sans-serif; }
        .font-rubik { --font-heading: 'Rubik', sans-serif; --font-body: 'Rubik', sans-serif; }
        .font-nunito { --font-heading: 'Nunito', sans-serif; --font-body: 'Nunito', sans-serif; }
        .font-crimson { --font-heading: 'Crimson Text', serif; --font-body: 'Lato', sans-serif; }
        .font-work-sans { --font-heading: 'Work Sans', sans-serif; --font-body: 'Work Sans', sans-serif; }
        .font-poppins { --font-heading: 'Poppins', sans-serif; --font-body: 'Poppins', sans-serif; }
        .font-raleway { --font-heading: 'Raleway', sans-serif; --font-body: 'Raleway', sans-serif; }
        .font-dm-sans { --font-heading: 'DM Sans', sans-serif; --font-body: 'DM Sans', sans-serif; }
        .font-manrope { --font-heading: 'Manrope', sans-serif; --font-body: 'Manrope', sans-serif; }
        .font-lexend { --font-heading: 'Lexend', sans-serif; --font-body: 'Lexend', sans-serif; }
        .font-pt-serif { --font-heading: 'PT Serif', serif; --font-body: 'Lato', sans-serif; }
        .font-libre-baskerville { --font-heading: 'Libre Baskerville', serif; --font-body: 'Lato', sans-serif; }

        /* Theme Colors */
        .theme-blue { --color-primary: #2563eb; --color-primary-light: rgba(37, 99, 235, 0.08); }
        .theme-emerald { --color-primary: #059669; --color-primary-light: rgba(5, 150, 105, 0.08); }
        .theme-charcoal { --color-primary: #1e293b; --color-primary-light: rgba(30, 41, 59, 0.08); }
        .theme-navy { --color-primary: #1e3a5f; --color-primary-light: rgba(30, 58, 95, 0.08); }
        .theme-burgundy { --color-primary: #7c143d; --color-primary-light: rgba(124, 20, 61, 0.08); }
        .theme-teal { --color-primary: #0d9488; --color-primary-light: rgba(13, 148, 136, 0.08); }
        .theme-purple { --color-primary: #7c3aed; --color-primary-light: rgba(124, 58, 237, 0.08); }
        .theme-rose { --color-primary: #e11d48; --color-primary-light: rgba(225, 29, 72, 0.08); }
        .theme-orange { --color-primary: #ea580c; --color-primary-light: rgba(234, 88, 12, 0.08); }
        .theme-amber { --color-primary: #d97706; --color-primary-light: rgba(217, 119, 6, 0.08); }
        .theme-slate { --color-primary: #475569; --color-primary-light: rgba(71, 85, 105, 0.08); }
        .theme-indigo { --color-primary: #4f46e5; --color-primary-light: rgba(79, 70, 229, 0.08); }
        .theme-cyan { --color-primary: #0891b2; --color-primary-light: rgba(8, 145, 178, 0.08); }
        .theme-lime { --color-primary: #65a30d; --color-primary-light: rgba(101, 163, 13, 0.08); }
        .theme-pink { --color-primary: #db2777; --color-primary-light: rgba(219, 39, 119, 0.08); }
        .theme-sky { --color-primary: #0284c7; --color-primary-light: rgba(2, 132, 199, 0.08); }

        .preview-container {
            background-color: #1a1d23;
            background-image: radial-gradient(#2d333d 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* A4 Page Canvas */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            color: var(--color-text);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
            padding: 18mm;
            box-sizing: border-box;
            font-family: var(--font-body);
            font-size: var(--base-font-size);
            line-height: var(--base-line-height);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .resume-name { font-family: var(--font-heading); font-size: 2.75em; font-weight: 700; color: var(--color-heading); line-height: 1.05; letter-spacing: -0.025em; }
        .resume-title { font-size: 1.1em; font-weight: 600; color: var(--color-primary); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 0.4em; }
        .resume-contact-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85em; color: #64748b; margin-top: 0.5em; }
        
        /* Section Header Bar */
        .resume-section-header {
            background-color: var(--color-primary-light);
            border-left: 4px solid var(--color-primary);
            padding: 6px 12px;
            margin-top: 1.8em;
            margin-bottom: 0.8em;
            display: flex;
            align-items: center;
        }

        .resume-section-title { 
            font-family: var(--font-heading); font-size: 1.05em; font-weight: 700; color: var(--color-heading); 
            text-transform: uppercase; letter-spacing: 0.08em; margin: 0;
        }
        
        .resume-item { margin-bottom: 1.25em; }
        .resume-item-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.15em; }
        .resume-item-title { font-weight: 700; font-size: 1.05em; color: var(--color-heading); }
        .resume-item-subtitle { font-weight: 500; font-size: 0.95em; color: var(--color-primary); font-style: italic; }
        .resume-item-date { font-size: 0.9em; color: #64748b; font-weight: 500; font-variant-numeric: tabular-nums; }
        
        .resume-text { font-size: 1em; color: var(--color-text); }
        .resume-text ul { list-style-type: disc; padding-left: 1.4em; margin-top: 0.25em; }
        .resume-text li { margin-bottom: 0.35em; }
        .resume-text b, .resume-text strong { font-weight: 600; color: var(--color-heading); }

        .skill-capsule {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.82em;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            color: var(--color-heading);
            margin-right: 6px;
            margin-bottom: 6px;
            background-color: #f8fafc;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        /* --- LAYOUT DISTINCTIONS --- */
        .resume-body { position: relative; z-index: 1; }
        
        /* TWO COLUMN MODERN */
        .layout-two-column .resume-header { text-align: center; margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 2px solid #f1f5f9; }
        .layout-two-column .resume-contact { justify-content: center; display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1rem; }
        .layout-two-column .resume-body { display: grid; grid-template-columns: 48% 48%; gap: 4%; }
        .layout-two-column .resume-sidebar { border-right: 1.5px solid #f1f5f9; padding-right: 4%; background: transparent; }
        
        /* LEFT SIDEBAR (sidebar left, main right) */
        .layout-sidebar-left .resume-body { display: grid; grid-template-columns: 32% 64%; gap: 4%; }
        .layout-sidebar-left .resume-sidebar { border-right: 1px solid #e2e8f0; padding-right: 5%; background-color: #fafbfc; }
        .layout-sidebar-left .resume-main { padding-left: 2%; }
        
        /* RIGHT SIDEBAR (main left, sidebar right) */
        .layout-sidebar-right .resume-body { display: grid; grid-template-columns: 64% 32%; gap: 4%; }
        .layout-sidebar-right .resume-sidebar { border-left: 1px solid #e2e8f0; padding-left: 5%; background-color: #fafbfc; }
        .layout-sidebar-right .resume-main { padding-right: 2%; }
        
        /* MINIMALIST EXECUTIVE */
        .layout-minimalist .resume-header { text-align: center; margin-bottom: 3rem; width: 100%; }
        .layout-minimalist .resume-contact { 
            display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 0 1rem;
            border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; padding: 10px 0; 
            margin: 1.5rem auto 0 auto; width: fit-content; max-width: 100%;
        }
        .layout-minimalist .resume-contact-item { margin-top: 0; padding: 2px 0; }
        .layout-minimalist .resume-contact-item i { display: none; }
        .layout-minimalist .resume-section-header { 
            background-color: transparent; border-left: none; border-bottom: 1px solid #1e293b; 
            justify-content: center; padding: 0; margin-top: 3rem; margin-bottom: 1.5rem; 
        }
        .layout-minimalist .resume-section-title { font-size: 1.2em; letter-spacing: 0.2em; color: var(--color-heading); }
        .layout-minimalist .resume-item { margin-bottom: 2rem; }
        .layout-minimalist .resume-item-header { flex-direction: column; align-items: center; text-align: center; margin-bottom: 0.5rem; }
        .layout-minimalist .resume-item-date { margin-top: 0.25rem; font-style: italic; color: var(--color-primary); }
        .layout-minimalist .resume-text { font-size: 1em; color: var(--color-text); }
        .layout-minimalist .resume-text ul { list-style-type: disc; padding-left: 1.4em; margin-top: 0.25em; }
        .layout-minimalist .resume-text li { margin-bottom: 0.35em; }
        .layout-minimalist .resume-text b, .layout-minimalist .resume-text strong { font-weight: 600; color: var(--color-heading); }
        .form-input { width: 100%; background-color: #090b10; border: 1px solid #1e293b; border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 0.875rem; color: #f1f5f9; transition: all 0.2s; }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .form-label { display: block; font-size: 0.7rem; font-weight: 700; color: #64748b; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .drag-handle { color: #3b82f6; cursor: grab; transition: transform 0.2s; }
        .drag-handle:hover { transform: scale(1.2); }
        .draggable-section.dragging { opacity: 0.5; transform: scale(0.98); }
        .item-hidden { opacity: 0.4; filter: grayscale(100%); }
        
        /* Drag and Drop Styles */
        .draggable-section {
            cursor: move;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .draggable-section.dragging {
            opacity: 0.3;
            transform: scale(0.92) rotate(2deg);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(147, 51, 234, 0.05));
        }
        
        .draggable-section:not(.dragging):hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
        }
        
        .drop-zone-above {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .drop-zone-above.opacity-100 {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            transform: scaleY(2.5);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .drag-handle {
            transition: all 0.3s ease;
        }
        
        .drag-handle:hover {
            transform: scale(1.3) rotate(5deg);
            color: #60a5fa;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }

        @media print {
            header, .settings-bar, aside, #toast-container, #custom-modal, footer { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .preview-container { padding: 0 !important; background: none !important; }
            .a4-page { box-shadow: none !important; margin: 0 !important; border: none !important; width: 100% !important; }
            @page { size: auto; margin: 0; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Header Tier 1: Branding (Midnight Blue) -->
    <header class="shrink-0 bg-[#020617] border-b border-slate-800 flex items-center px-6 py-4 z-20 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-file-invoice text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight text-white leading-none">Resume Builder</h1>
                <p class="text-[9px] text-blue-400 font-bold uppercase tracking-widest mt-1">Professional Individual Edition</p>
            </div>
        </div>
    </header>

    <!-- Header Tier 2: Action Dashboard (Slate Blue) -->
    <section class="shrink-0 bg-[#1e293b] border-b border-slate-700 flex items-center justify-between px-6 py-2.5 z-10 shadow-md">
        <div class="flex items-center gap-4">
            <!-- Profile Manager Container -->
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-[#0f172a] px-3 py-1.5 rounded-lg border border-slate-700 shadow-inner">
                    <i class="fa-solid fa-folder-open text-slate-400 text-xs"></i>
                    <select id="sel-profile" class="bg-transparent text-xs font-semibold text-slate-200 outline-none cursor-pointer min-w-[140px]" onchange="switchProfile(this.value)">
                    </select>
                </div>
                
                <!-- Delete Button -->
                <button id="btn-delete-resume" onclick="deleteCurrentResume()" class="px-4 py-2 text-slate-300 hover:text-slate-100 text-[10px] font-bold transition-all flex items-center gap-2" title="Delete current resume">
                    🗑️ Delete Resume
                </button>
                
                <!-- New Resume Button -->
                <button onclick="createNewResume()" class="px-2.5 py-1 rounded-lg bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 rounded-lg text-white text-[9px] font-bold transition-all border border-green-600/30 flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-green-300"></i> New Resume
                </button>
            </div>

            <!-- Load Sample Utility -->
            <button onclick="loadSampleData()" class="px-3 py-1.5 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-[10px] font-bold transition-all border border-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-yellow-500"></i> Load Sample Guide
            </button>
        </div>

        <!-- Global Action: Download copy -->
        <button onclick="openDownloadOptions()" class="px-5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold transition-all shadow-lg flex items-center gap-2 uppercase tracking-wider">
            <i class="fa-solid fa-download"></i> Download copy
        </button>
    </section>

    <!-- Advanced Features Toolbar -->
    <div class="h-12 shrink-0 bg-[#1e293b] border-b border-slate-800 flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-3">
            <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mr-2">Advanced Tools:</span>
            <button onclick="openCoverLetterBuilder()" class="px-3 py-1.5 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 text-[9px] font-bold transition-all border border-indigo-600/30 flex items-center gap-1.5">
                <i class="fa-solid fa-file-pen"></i> Cover Letter
            </button>
            <button onclick="openJobDescriptionMatcher()" class="px-3 py-1.5 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-[9px] font-bold transition-all border border-emerald-600/30 flex items-center gap-1.5">
                <i class="fa-solid fa-bullseye"></i> JD Matcher
            </button>
            <button onclick="openKeywordDensityChecker()" class="px-3 py-1.5 rounded-lg bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 text-[9px] font-bold transition-all border border-amber-600/30 flex items-center gap-1.5">
                <i class="fa-solid fa-key"></i> Keyword Density
            </button>
            <button onclick="openReadabilityAnalyzer()" class="px-3 py-1.5 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-400 text-[9px] font-bold transition-all border border-cyan-600/30 flex items-center gap-1.5">
                <i class="fa-solid fa-book-open"></i> Readability Score
            </button>
            <button onclick="openATSCompatibilityChecker()" class="px-3 py-1.5 rounded-lg bg-violet-600/20 hover:bg-violet-600/30 text-violet-400 text-[9px] font-bold transition-all border border-violet-600/30 flex items-center gap-1.5">
                <i class="fa-solid fa-robot"></i> ATS Checker
            </button>
            <button onclick="openQRCodeGenerator()" class="px-3 py-1.5 rounded-lg bg-lime-600/20 hover:bg-lime-600/30 text-lime-400 text-[9px] font-bold transition-all border border-lime-600/30 flex items-center gap-1.5">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-12 right-6 flex flex-col gap-3 z-50 pointer-events-none"></div>

    <script>
        const DEFAULT_SETTINGS = { theme: 'blue', font: 'merriweather', layout: 'single', fontSize: 14, lineSpacing: 1.6 };
        const DEFAULT_SECTION_ORDER = ['summary', 'skills', 'experience', 'certifications', 'education'];
        
        const getAvatar = (name) => `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Alexander Sterling')}&background=0f172a&color=3b82f6&bold=true&size=256&rounded=true&font-size=0.33`;

        const EMPTY_PROFILE = {
            name: "New Resume",
            personal: { name: '', title: '', email: '', phone: '', location: '', link: '', summary: '', skills: '', photo: '' },
            experience: [], education: [], certifications: [], customSections: [],
            sectionOrder: [...DEFAULT_SECTION_ORDER],
            settings: { ...DEFAULT_SETTINGS }
        };

        let appData = { activeProfileId: 'default', profiles: {} };
        let state = null;

        let modalCallback = null;
        function openModal({ title, msg, type, defaultValue }, callback) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            
            // Set content
            document.getElementById('modal-title').textContent = title;
            const msgEl = document.getElementById('modal-msg');
            msgEl.textContent = msg || '';
            msgEl.style.display = msg ? 'block' : 'none';
            
            // Handle input field
            const inputEl = document.getElementById('modal-input');
            inputEl.style.display = type === 'prompt' ? 'block' : 'none';
            inputEl.value = defaultValue || '';
            
            // Set callback
            modalCallback = callback;
            
            // Set up confirm button
            document.getElementById('modal-confirm-btn').onclick = () => {
                closeModal();
                if (modalCallback) modalCallback(type === 'prompt' ? inputEl.value : true);
            };
            
            // Show modal
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            
            // Animate in
            requestAnimationFrame(() => {
                content.classList.remove('scale-95', 'opacity-0');
            });
        }
        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            
            // Animate out
            content.classList.add('scale-95', 'opacity-0');
            
            // Hide modal after animation
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
                modalCallback = null;
            }, 200);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('resumeBuilderProData');
            if (saved) {
                try { appData = JSON.parse(saved); } catch (e) { initSampleData(); }
            } else { initSampleData(); }
            if (!appData.profiles || Object.keys(appData.profiles).length === 0) initSampleData();
            switchProfile(appData.activeProfileId || Object.keys(appData.profiles)[0]);
            updateProfileDropdown();
        });

        function saveState() {
            localStorage.setItem('resumeBuilderProData', JSON.stringify(appData));
            const status = document.getElementById('save-status');
            status.style.opacity = '1';
            setTimeout(() => status.style.opacity = '0', 1000);
        }

        function switchProfile(id) {
            if (!appData.profiles[id]) id = Object.keys(appData.profiles)[0];
            appData.activeProfileId = id;
            state = appData.profiles[id];
            if (!state.sectionOrder || state.sectionOrder.length < 5) state.sectionOrder = [...DEFAULT_SECTION_ORDER];
            if(!state.settings) state.settings = {...DEFAULT_SETTINGS};
            populateFormFromState();
            updateProfileDropdown();
            saveState();
        }

        function updateProfileDropdown() {
            const select = document.getElementById('sel-profile');
            select.innerHTML = '';
            for (const [id, profile] of Object.entries(appData.profiles)) {
                const opt = document.createElement('option');
                opt.value = id; opt.textContent = profile.name;
                if (id === appData.activeProfileId) opt.selected = true;
                select.appendChild(opt);
            }
            
            const btnDel = document.getElementById('btn-delete-resume');
            if (btnDel) btnDel.style.display = (appData.activeProfileId === 'sample_engineer' || Object.keys(appData.profiles).length <= 1) ? 'none' : 'flex';
        }

        function deleteProfile(profileId) {
            const profile = appData.profiles[profileId];
            if (!profile) return;
            
            if (confirm(`Delete "${profile.name}" permanently?`)) {
                delete appData.profiles[profileId];
                
                // If deleting the active profile, switch to another one
                if (appData.activeProfileId === profileId) {
                    const remainingIds = Object.keys(appData.profiles).filter(id => id !== profileId);
                    if (remainingIds.length > 0) {
                        appData.activeProfileId = remainingIds[0];
                    } else {
                        // Reset to empty state if no profiles left
                        appData.activeProfileId = null;
                        state = JSON.parse(JSON.stringify(EMPTY_PROFILE));
                    }
                }
                
                localStorage.setItem('resume_builder_app_data', JSON.stringify(appData));
                updateProfileDropdown();
                updatePreview();
                
                if (appData.activeProfileId === profileId) {
                    populateFormFromState();
                } else {
                    // Clear form if active profile was deleted
                    document.getElementById('resume-form')?.reset();
                }
                
                showToast(`"${profile.name}" deleted successfully!`, 'success');
            }
        }

        function deleteCurrentResume() {
            console.log('Delete resume button clicked');
            
            if (appData.activeProfileId === 'sample_engineer') { 
                showToast('Cannot delete sample resume', 'error'); 
                return; 
            }
            
            const profileIds = Object.keys(appData.profiles);
            if (profileIds.length <= 1) { 
                showToast('Cannot delete only profile', 'error'); 
                return; 
            }
            
            const resumeName = state.name || 'Current Resume';
            
            // Create delete confirmation modal
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[100] flex items-center justify-center';
            modal.innerHTML = `
                <div class="bg-gradient-to-br from-[#11141b] to-[#1e293b] border border-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold text-white flex items-center gap-3">
                            <i class="fa-solid fa-trash text-red-500"></i> Delete Resume
                        </h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-white/70 hover:text-white transition-colors">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="bg-red-500/10 border border-red-500/30 rounded-lg p-4">
                            <p class="text-red-400 text-sm font-semibold mb-2">⚠️ Warning</p>
                            <p class="text-white/80 text-sm">This action cannot be undone. All data in "${resumeName}" will be permanently deleted.</p>
                        </div>
                        
                        <div class="flex gap-3 pt-2">

        function confirmDeleteResume() {
            console.log('Confirm delete resume called');
            
            try {
                const profileId = appData.activeProfileId;
                const profile = appData.profiles[profileId];
                const profileIds = Object.keys(appData.profiles);
                
                // Find and close modal immediately
                const modal = document.querySelector('.fixed');
                if (modal) {
                    console.log('Closing delete modal immediately');
                    modal.remove();
                } else {
                    console.error('Delete modal not found for removal');
                }
                
                // Delete the profile
                delete appData.profiles[profileId];
                
                // Switch to next available profile
                const remainingIds = profileIds.filter(id => id !== profileId);
                if (remainingIds.length > 0) {
                    const nextId = remainingIds[0];
                    appData.activeProfileId = nextId;
                    switchProfile(nextId);
                } else {
                    // No profiles left, create empty one
                    const newId = generateId();
                    const freshResume = JSON.parse(JSON.stringify(EMPTY_PROFILE));
                    freshResume.id = newId;
                    freshResume.name = 'New Resume';
                    appData.profiles[newId] = freshResume;
                    appData.activeProfileId = newId;
                    state = freshResume;
                }
                
                // Update UI
                updateProfileDropdown();
                saveState();
                
                // Show success message immediately
                showToast(`"${profile.name}" deleted successfully!`, 'success');
                
                console.log('Resume deletion completed');
                
            } catch (error) {
                console.error('Error deleting resume:', error);
                
                // Close modal on error
                const modal = document.querySelector('.fixed');
                if (modal) {
                    modal.remove();
                }
                
                showToast('Error deleting resume. Please try again.', 'error');
            }
        }

        let draggedSectionId = null;
        function handleSectionDragStart(e, secId) { 
            e.stopPropagation(); 
            draggedSectionId = secId; 
            e.target.classList.add('dragging');
            console.log('Drag started for section:', secId);
        }
        function handleSectionDragOver(e) { 
            e.preventDefault(); 
            e.stopPropagation();
            
            // Show drop zone when dragging over
            const dropZone = e.target.closest('.drop-zone-above');
            if (dropZone) {
                dropZone.classList.remove('opacity-0');
                dropZone.classList.add('opacity-100');
            }
        }
        function handleSectionDragLeave(e) { 
            e.stopPropagation();
            
            // Hide drop zone when leaving
            const dropZone = e.target.closest('.drop-zone-above');
            if (dropZone) {
                dropZone.classList.remove('opacity-100');
                dropZone.classList.add('opacity-0');
            }
        }
        function handleSectionDrop(e, targetSecId) {
            e.preventDefault(); e.stopPropagation();
            if (!draggedSectionId) return;
            
            // Handle drop zone logic
            let targetSection = targetSecId;
            let insertAbove = false;
            
            if (targetSecId.includes('-above')) {
                targetSection = targetSecId.replace('-above', '');
                insertAbove = true;
            }
            
            if (draggedSectionId === targetSection) return;
            
            console.log('Drop detected - from:', draggedSectionId, 'to:', targetSection, 'insertAbove:', insertAbove);
            
            const from = state.sectionOrder.indexOf(draggedSectionId); 
            const to = state.sectionOrder.indexOf(targetSection);
            
            console.log('Current section order:', state.sectionOrder);
            console.log('Moving from index', from, 'to index', to, 'above:', insertAbove);
            
            if(from > -1 && to > -1) { 
                // Remove dragged section from current position
                state.sectionOrder.splice(from, 1); 
                
                // Calculate new position
                let newPosition = to;
                if (from < to && !insertAbove) {
                    newPosition = to - 1; // Adjust position if dragging forward and not inserting above
                } else if (insertAbove) {
                    newPosition = to; // Insert above target
                } else {
                    newPosition = to + 1; // Insert below target
                }
                
                // Insert at new position
                state.sectionOrder.splice(newPosition, 0, draggedSectionId); 
                
                console.log('New section order:', state.sectionOrder);
                
                // Update sidebar order and preview
                updateSidebarOrder(); 
                saveState();
                
                // Force preview update for all layouts
                setTimeout(() => {
                    updatePreview();
                    console.log('Section order updated, preview refreshed for all layouts');
                }, 50);
            }
            
            // Hide all drop zones
            document.querySelectorAll('.drop-zone-above').forEach(zone => {
                zone.classList.remove('opacity-100');
                zone.classList.add('opacity-0');
            });
        }
        function handleSectionDragEnd(e) { e.stopPropagation(); e.target.classList.remove('dragging'); draggedSectionId = null; }

            if(p.location) contactArr.push(p.location);

            blocks['education'] = state.education.some(e=>e.visible!==false) ? `<div class="resume-section-block">${sectionHeader('Education')}<div>${state.education.map(e=>genPreviewBlock(e, 'degree', 'school')).join('')}</div></div>` : '';
            blocks['certifications'] = state.certifications.some(e=>e.visible!==false) ? `<div class="resume-section-block">${sectionHeader('Certifications')}<div>${state.certifications.map(c=>genPreviewBlock(c, 'title', 'subtitle')).join('')}</div></div>` : '';
            let skillArr = p.skills ? p.skills.split(',').map(str=>str.trim()).filter(x=>x) : [];

                const sidebarHeader = `${photoHTML}<h1 class="resume-name">${p.name || 'Your Name'}</h1>${p.title ? `<div class="resume-title">${p.title}</div>` : ''}<div class="resume-contact">${contactArr.map(item => `<span class="resume-contact-item">${item}</span>`).join('')}</div>`;
                finalHTML = `<div class="a4-page theme-${s.theme} font-${s.font} layout-sidebar-left" id="resume-preview" style="--base-font-size:${s.fontSize}px; --base-line-height:${s.lineSpacing}"><div class="resume-body"><div class="resume-sidebar">${sidebarHeader}${sidebarCol}</div><div class="resume-main">${mainCol}</div></div></div>`;

        function populateFormFromState() {
            const keyMap = { fontsize: 'fontSize', linespacing: 'lineSpacing' };
            const ids = ['sel-theme', 'sel-font', 'sel-layout', 'sel-fontsize-preset', 'rng-linespacing'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const rawKey = id.split('-')[1];
                const key = keyMap[rawKey] || rawKey;
                const val = state.settings[key] ?? DEFAULT_SETTINGS[key];
                if (id === 'sel-fontsize-preset') {
                    const v = parseFloat(val);
                    el.value = v <= 12 ? '11' : v <= 15 ? '14' : '17';
                } else el.value = val;
            });
            const pIds = ['name', 'title', 'email', 'phone', 'location', 'link', 'summary'];
            pIds.forEach(id => { const el = document.getElementById('inp-'+id); if (el) el.value = state.personal[id] || ''; });
            const photoP = document.getElementById('inp-photo-preview'); photoP.src = state.personal.photo || getAvatar(state.personal.name);
            renderAllForms();
        }

            const profileIds = Object.keys(appData.profiles);

        function matchJD() {
            const jd = (document.getElementById('jd-input')?.value || '').toLowerCase();
            const skills = (state.personal.skills || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
            const summary = (state.personal.summary || '').toLowerCase();
            const expText = state.experience.map(e => (e.desc || '').toLowerCase()).join(' ');
            const allResume = (skills.join(' ') + ' ' + summary + ' ' + expText).toLowerCase();
            const jdWords = jd.split(/\s+/).filter(w => w.length > 3);
            const matched = [], missing = [];
            jdWords.forEach(w => { if (allResume.includes(w) && !matched.includes(w)) matched.push(w); });
            skills.forEach(s => { if (jd.includes(s) && !matched.includes(s)) matched.push(s); });
            const topJd = [...new Set(jd.match(/\b\w{4,}\b/g) || [])].slice(0, 40);
            topJd.forEach(w => { if (!allResume.includes(w) && !missing.includes(w)) missing.push(w); });
            const score = Math.min(100, Math.round((matched.length / Math.max(1, topJd.length)) * 100));
            const el = document.getElementById('jd-results');
            if (el) el.innerHTML = `<p class="text-emerald-400 font-bold mb-2">Match Score: ${score}%</p><p class="text-white/70 text-xs mb-2">Matched keywords: ${matched.slice(0,15).join(', ')}${matched.length>15?'...':''}</p><p class="text-amber-400 text-xs">Consider adding: ${missing.slice(0,10).join(', ')}${missing.length>10?'...':''}</p>`;
        }

        function openKeywordDensityChecker() {
            const text = ((state.personal.summary || '') + ' ' + (state.personal.skills || '') + ' ' + state.experience.map(e => e.desc || '').join(' ')).toLowerCase().replace(/<[^>]+>/g,' ');
            const words = text.match(/\b\w+\b/g) || [];
            const total = words.length;
            const freq = {};
            words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
            const sorted = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 20);
            const content = `<p class="text-white/60 text-sm mb-4">Total words: ${total}. Top 20 by frequency:</p><div class="space-y-1">${sorted.map(([w,c]) => `<div class="flex justify-between text-sm"><span>${w}</span><span class="text-amber-400">${c} (${total?(c/total*100).toFixed(1):0}%)</span></div>`).join('')}</div>`;
            openModalFull('<i class="fa-solid fa-key text-amber-500"></i> Keyword Density Checker', content);
        }

        function openReadabilityAnalyzer() {
            const text = ((state.personal.summary || '') + ' ' + state.experience.map(e => e.desc || '').join(' ')).replace(/<[^>]+>/g,' ');
            const words = (text.match(/\b\w+\b/g) || []).length;
            const sents = (text.match(/[.!?]+/g) || []).length || 1;
            const syllEst = text.split(/\s+/).filter(Boolean).reduce((n,w)=> n + Math.max(1, Math.ceil(w.length/3)), 0);
            const flesch = words ? 206.835 - 1.015*(words/sents) - 84.6*(syllEst/words) : 0;
            const grade = words ? Math.max(1, Math.min(20, Math.round(0.39*(words/sents) + 11.8*(syllEst/words) - 15.59))) : 0;
            const content = `<div class="space-y-4"><div class="grid grid-cols-2 gap-4"><div class="bg-white/10 rounded p-4"><p class="text-white/60 text-xs">Readability Score</p><p class="text-2xl text-cyan-400 font-bold">${Math.round(flesch)}</p><p class="text-white/60 text-xs">0-100, higher = easier</p></div><div class="bg-white/10 rounded p-4"><p class="text-white/60 text-xs">Est. Grade Level</p><p class="text-2xl text-cyan-400 font-bold">${grade}</p></div></div><p class="text-white/70 text-sm">${flesch>=60?'Good':'Consider simplifying sentences'} for resume readability.</p></div>`;
            openModalFull('<i class="fa-solid fa-book-open text-cyan-500"></i> Readability Score Analyzer', content);
        }

        function openSkillsGapAnalysis() {
            const jd = prompt('Paste key skills from job description (comma-separated):') || '';
            const jdSkills = jd.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
            const mySkills = (state.personal.skills||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);

        function runQualityCheck() {
            const results = document.getElementById('quality-results');
            const scoreElement = document.getElementById('score-number');
            const scoreDesc = document.getElementById('score-description');
            let score = 0;
            const issues = [];
            
            // Check content completeness
            const hasName = state.personal.name && state.personal.name.trim();
            const hasSummary = state.personal.summary && state.personal.summary.trim();
            const hasSkills = state.personal.skills && state.personal.skills.trim();
            const hasExperience = state.experience && state.experience.length > 0;
            const hasEducation = state.education && state.education.length > 0;
            
            if (hasName) score += 15;
            else issues.push({ type: 'missing', issue: 'Missing name', severity: 'high' });
            
            if (hasSummary) score += 20;
            else issues.push({ type: 'missing', issue: 'Missing professional summary', severity: 'high' });
            
            if (hasSkills) score += 15;
            else issues.push({ type: 'missing', issue: 'Missing skills section', severity: 'medium' });
            
            if (hasExperience && state.experience.length >= 2) score += 25;
            else if (hasExperience) score += 15;
            else issues.push({ type: 'missing', issue: 'Missing work experience', severity: 'high' });
            
            if (hasEducation) score += 15;
            else issues.push({ type: 'missing', issue: 'Missing education', severity: 'medium' });
            
            // Check content quality
            const summaryLength = state.personal.summary ? state.personal.summary.length : 0;
            if (summaryLength >= 100 && summaryLength <= 300) score += 10;
            else if (summaryLength < 100) issues.push({ type: 'quality', issue: 'Summary too short (aim for 100-300 characters)', severity: 'medium' });
            else if (summaryLength > 300) issues.push({ type: 'quality', issue: 'Summary too long (aim for 100-300 characters)', severity: 'low' });
            
            // Check experience descriptions
            const expWithDesc = state.experience.filter(e => e.desc && e.desc.trim().length > 20);
            if (expWithDesc.length === state.experience.length && state.experience.length > 0) score += 15;
            else issues.push({ type: 'quality', issue: 'Some experience entries lack detailed descriptions', severity: 'medium' });
            
            // Cap score at 100
            score = Math.min(score, 100);
            
            // Display results
            const scoreColor = score >= 80 ? 'text-green-400' : score >= 60 ? 'text-yellow-400' : 'text-red-400';
            const scoreLabel = score >= 80 ? 'Excellent' : score >= 60 ? 'Good' : 'Needs Improvement';
            
            scoreElement.textContent = score;
            scoreElement.className = `text-6xl font-bold mb-2 ${scoreColor}`;
            scoreDesc.textContent = `Your resume quality is: ${scoreLabel}`;
            
            results.innerHTML = `
                <div class="space-y-3">
                    <p class="text-purple-400 font-semibold mb-2">Quality Analysis Results:</p>
                    ${issues.map(issue => `
                        <div class="bg-white/5 rounded p-3 border-l-4 ${
                            issue.severity === 'high' ? 'border-red-400' :
                            issue.severity === 'medium' ? 'border-yellow-400' :
                            'border-blue-400'
                        }">
                            <div class="flex items-start gap-2">
                                <i class="fa-solid fa-${
                                    issue.type === 'missing' ? 'exclamation-triangle' :
                                    issue.type === 'quality' ? 'info-circle' :
                                    'check-circle'
                                } text-${
                                    issue.severity === 'high' ? 'red-400' :
                                    issue.severity === 'medium' ? 'yellow-400' :
                                    'blue-400'
                                } mt-1"></i>
                                <div class="flex-1">
                                    <p class="text-xs mb-1">${issue.issue}</p>
                                    <p class="text-xs text-white/60">Severity: ${issue.severity}</p>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

                },
                healthcare: {
                    summary: 'Compassionate registered nurse with 7+ years of experience in critical care and emergency medicine. Dedicated to providing exceptional patient care and improving clinical outcomes through evidence-based practice.',
                    skills: 'Patient Assessment, IV Therapy, Medication Administration, Electronic Health Records, CPR/BLS, Critical Care, Patient Education, Clinical Documentation',
                    experience: [
                        { role: 'Registered Nurse - ICU', org: 'City Medical Center', duration: '2019-Present', desc: 'Managed care for 8-10 critically ill patients per shift, implementing evidence-based protocols that reduced infection rates by 30% and improved patient outcomes.' },
                        { role: 'Emergency Room Nurse', org: 'Regional Hospital', duration: '2017-2019', desc: 'Provided triage and emergency care for 50+ patients daily, collaborating with multidisciplinary teams to deliver timely and effective treatment.' }

                },
                finance: {
                    summary: 'Detail-oriented financial analyst with 6+ years of experience in investment analysis, risk management, and financial modeling. Proven track record of delivering data-driven insights that drive strategic decision-making.',
                    skills: 'Financial Modeling, Risk Assessment, Portfolio Management, Excel, Bloomberg Terminal, SQL, Python, Regulatory Compliance, Due Diligence',
                    experience: [
                        { role: 'Senior Financial Analyst', org: 'Investment Firm', duration: '2019-Present', desc: 'Analyzed investment opportunities for $50M portfolio, achieving 15% annual returns and identifying cost-saving opportunities worth $2M annually.' },
                        { role: 'Financial Analyst', org: 'Bank Corp', duration: '2017-2019', desc: 'Developed financial models for M&A transactions valued at $100M+, supporting due diligence processes and integration planning.' }
                    ]
                }
            };
            
            const template = templates[industry];
            if (!template) {
                showToast('Template not available yet', 'error');
                return;
            }
            
            // Apply template to current state
            state.personal.summary = template.summary;
            state.personal.skills = template.skills;
            state.experience = template.experience;
            
            populateFormFromState();
            updatePreview();
            saveState();
            
            showToast(`${industry.charAt(0).toUpperCase() + industry.slice(1)} template applied successfully!`, 'success');
            
            // Close modal
            document.querySelector('.fixed').remove();
        }
        function openSpellCheck() {
            console.log('Spell Check clicked');
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[100] flex items-center justify-center';
            modal.innerHTML = `
                <div class="bg-gradient-to-br from-[#11141b] to-[#1e293b] border border-slate-800 rounded-2xl shadow-2xl w-full max-w-4xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold text-white flex items-center gap-3">
                            <i class="fa-solid fa-spell-check text-yellow-500"></i> Spell Check & Grammar
                        </h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-white/70 hover:text-white transition-colors">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex gap-4">
                            <button onclick="runSpellCheck()" class="px-4 py-2 bg-gradient-to-r from-yellow-600 to-orange-600 hover:from-yellow-500 hover:to-orange-500 rounded-lg text-white font-semibold transition-all">
                                <i class="fa-solid fa-search"></i> Run Spell Check
                            </button>
                            <button onclick="runGrammarCheck()" class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-lg text-white font-semibold transition-all">
                                <i class="fa-solid fa-book"></i> Run Grammar Check
                            </button>
                        </div>
                        
                        <div id="spell-check-results" class="bg-white/10 backdrop-blur-sm rounded-lg p-4 min-h-[200px] text-white text-sm">
                            <p class="text-white/60">Click "Run Spell Check" or "Run Grammar Check" to analyze your resume content.</p>
                        </div>
                        
                        <div class="bg-white/5 rounded-lg p-4">
                            <h4 class="text-white font-semibold mb-2">Quick Tips:</h4>
                            <ul class="text-white/70 text-xs space-y-1">
                                <li>• Check for consistent verb tense throughout your experience descriptions</li>
                                <li>• Ensure proper capitalization of job titles and company names</li>
                                <li>• Use action verbs to start bullet points (Managed, Developed, Created, etc.)</li>
                                <li>• Avoid passive voice and use active voice instead</li>
                                <li>• Check for proper punctuation and spacing</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        const commonMistakes = {
            'acheived':'achieved','accomodate':'accommodate','accomplishment':'accomplishment','occured':'occurred',
            'experiance':'experience','recieve':'receive','seperate':'separate','definately':'definitely',
            'environement':'environment','managment':'management','responsability':'responsibility','succesful':'successful',
            'teh':'the','adress':'address','developement':'development','perfer':'prefer','refered':'referred'
        };

        function runSpellCheck() {
            const results = document.getElementById('spell-check-results');
            if (!results) return;
            const issues = [];
            const parts = [
                state.personal.summary || '',
                state.personal.skills || '',
                ...(state.experience || []).map(e => e.desc || ''),
                ...(state.education || []).map(e => (e.degree || '') + ' ' + (e.school || '')),
                ...(state.certifications || []).map(c => (c.title || '') + ' ' + (c.subtitle || ''))
            ];
            const allText = parts.filter(Boolean).join(' ').replace(/<[^>]+>/g,' ').toLowerCase();

            Object.entries(commonMistakes).forEach(([wrong, correct]) => {
                if (allText.includes(wrong)) {
                    issues.push({
                        type: 'spelling',
                        issue: `Possible spelling error: "${wrong}" should be "${correct}"`,
                        severity: 'medium'
                    });
                }
            });

            // Check for common resume-specific issues
            if (/\b(i|me|my|myself)\b/i.test(allText)) {
                issues.push({
                    type: 'style',
                    issue: 'Consider using more professional language instead of first-person pronouns',
                    severity: 'low'
                });
            }
            if (/\b(resume|cv|curriculum vitae)\b/i.test(allText)) {
                issues.push({
                    type: 'content',
                    issue: 'Avoid mentioning "resume" in your resume content',
                    severity: 'medium'
                });
            }
            
            // Display results
            if (issues.length === 0) {
                results.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fa-solid fa-check-circle text-4xl text-green-400 mb-4"></i>
                        <p class="text-green-400 font-semibold">No spelling issues found!</p>
                        <p class="text-white/60 text-sm mt-2">Your resume looks good from a spelling perspective.</p>
                    </div>
                `;
            } else {
                results.innerHTML = `
                    <div class="space-y-3">
                        <p class="text-yellow-400 font-semibold">Found ${issues.length} potential issues:</p>
                        ${issues.map(issue => `
                            <div class="bg-white/5 rounded p-3 border-l-4 ${
                                issue.severity === 'high' ? 'border-red-400' :
                                issue.severity === 'medium' ? 'border-yellow-400' :
                                'border-blue-400'
                            }">
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-${
                                        issue.type === 'spelling' ? 'spell-check' :
                                        issue.type === 'grammar' ? 'book' :
                                        'info-circle'
                                    } text-${
                                        issue.severity === 'high' ? 'red-400' :
                                        issue.severity === 'medium' ? 'yellow-400' :
                                        'blue-400'
                                    } mt-1"></i>
                                    <div>
                                        <p class="text-xs">${issue.issue}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }
        
        function runGrammarCheck() {
            const results = document.getElementById('spell-check-results');
            if (!results) return;
            const issues = [];
            const experienceTexts = (state.experience || []).map(e => e.desc || '').join(' ').replace(/<[^>]+>/g,' ');
            
            // Check for common grammar issues
            if (experienceTexts.match(/\b(I|we|my|our)\b/gi)) {
                issues.push({
                    type: 'grammar',
                    issue: 'Remove first-person pronouns (I, we, my, our) from resume descriptions',
                    severity: 'high',
                    suggestion: 'Start sentences with action verbs instead'
                });
            }
            
            // Check for passive voice indicators
            if (experienceTexts.match(/\b(was|were|been|being)\s+\w+ed\b/gi)) {
                issues.push({
                    type: 'style',
                    issue: 'Possible passive voice detected. Use active voice for stronger impact.',
                    severity: 'medium',
                    suggestion: 'Replace passive constructions with active verbs'
                });
            }
            
            // Check for consistent tense
            const pastTense = experienceTexts.match(/\b\w+ed\b/g) || [];
            const presentTense = experienceTexts.match(/\b\w+s\b/g) || [];
            
            if (pastTense.length > 0 && presentTense.length > 0) {
                issues.push({
                    type: 'consistency',
                    issue: 'Mixed verb tenses detected. Use consistent past tense for experience descriptions.',
                    severity: 'medium',
                    suggestion: 'Use past tense for completed roles, present tense for current roles'
                });
            }
            
            // Check for bullet point consistency
            const bulletPoints = (state.experience || []).map(e => (e.desc || '').split('.')).flat();
            const inconsistentBullets = bulletPoints.filter(bp => 
                bp.trim() && !bp.match(/^[A-Z]/)
            );
            
            if (inconsistentBullets.length > 0) {
                issues.push({
                    type: 'formatting',
                    issue: 'Some bullet points may not start with capital letters',
                    severity: 'low',
                    suggestion: 'Ensure all bullet points start with capital letters'
                });
            }
            
            // Display results
            if (issues.length === 0) {
                results.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fa-solid fa-check-circle text-4xl text-green-400 mb-4"></i>
                        <p class="text-green-400 font-semibold">No grammar issues found!</p>
                        <p class="text-white/60 text-sm mt-2">Your resume has good grammar and style.</p>
                    </div>
                `;
            } else {
                results.innerHTML = `
                    <div class="space-y-3">
                        <p class="text-blue-400 font-semibold">Found ${issues.length} grammar/style suggestions:</p>
                        ${issues.map(issue => `
                            <div class="bg-white/5 rounded p-3 border-l-4 ${
                                issue.severity === 'high' ? 'border-red-400' :
                                issue.severity === 'medium' ? 'border-yellow-400' :
                                'border-blue-400'
                            }">
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-${
                                        issue.type === 'grammar' ? 'book' :
                                        issue.type === 'style' ? 'palette' :
                                        issue.type === 'consistency' ? 'sync' :
                                        'align-left'
                                    } text-${
                                        issue.severity === 'high' ? 'red-400' :
                                        issue.severity === 'medium' ? 'yellow-400' :
                                        'blue-400'
                                    } mt-1"></i>
                                    <div class="flex-1">
                                        <p class="text-xs mb-1">${issue.issue}</p>
                                        ${issue.suggestion ? `<p class="text-xs text-white/60">💡 ${issue.suggestion}</p>` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }
        
        function openAutoSaveVersions() {
            console.log('Auto Save Versions clicked');
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[100] flex items-center justify-center';
            modal.innerHTML = `
                <div class="bg-gradient-to-br from-[#11141b] to-[#1e293b] border border-slate-800 rounded-2xl shadow-2xl w-full max-w-4xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold text-white flex items-center gap-3">
                            <i class="fa-solid fa-clock-rotate-left text-purple-500"></i> Auto-Save Versions
                        </h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-white/70 hover:text-white transition-colors">
                            <i class="fa-solid fa-times text-xl"></i>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="text-white font-semibold">Auto-Save Status</h4>
                                <p class="text-white/60 text-sm">Automatically saves your resume every 30 seconds</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <div id="auto-save-indicator" class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
                                <span id="auto-save-status" class="text-green-400 text-sm">Active</span>
                            </div>
                        </div>
                        
                        <div class="bg-white/10 rounded-lg p-4">
                            <h4 class="text-white font-semibold mb-3">Recent Versions</h4>
                            <div id="versions-list" class="space-y-2 max-h-64 overflow-y-auto">
                                <p class="text-white/60 text-sm">Loading versions...</p>
                            </div>
                        </div>
                        
                        <div class="flex gap-3">
                            <button onclick="createManualSave()" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-lg text-white font-semibold transition-all">
                                <i class="fa-solid fa-save"></i> Create Manual Save
                            </button>
                            <button onclick="clearOldVersions()" class="px-4 py-2 bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 rounded-lg text-white font-semibold transition-all">
                                <i class="fa-solid fa-trash"></i> Clear Old Versions
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            // Load and display versions
            loadVersions();
        }
        
        // Auto-save functionality
        let autoSaveInterval;
        
        function getVersions() {
            try { return JSON.parse(localStorage.getItem('resume_versions') || '[]'); } catch(e) { return []; }
        }
        function loadVersions() {
            const versions = getVersions();
            const el = document.getElementById('versions-list');
            if (!el) return;
            if (versions.length === 0) { el.innerHTML = '<p class="text-white/60 text-sm">No saved versions yet.</p>'; return; }
            el.innerHTML = versions.slice(0, 10).map((v,i) => `
                <div class="flex items-center justify-between p-2 bg-white/5 rounded">
                    <span class="text-white text-sm">${v.name || 'Version ' + (i+1)}</span>
                    <div class="flex gap-2">
                        <button onclick="restoreVersion(${i})" class="text-emerald-400 text-xs hover:underline">Restore</button>
                        <button onclick="deleteVersion(${i})" class="text-red-400 text-xs hover:underline">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        function restoreVersion(idx) {
            const versions = getVersions();
            const v = versions[idx];
            if (v && v.data) { Object.assign(appData, v.data); switchProfile(appData.activeProfileId); populateFormFromState(); updateProfileDropdown(); saveState(); showToast('Version restored', 'success'); document.querySelector('.fixed')?.remove(); }
        }
        function deleteVersion(idx) {
            const versions = getVersions();
            versions.splice(idx, 1);
            localStorage.setItem('resume_versions', JSON.stringify(versions));
            loadVersions();
            showToast('Version deleted', 'success');
        }
        function createManualSave() {
            const versions = getVersions();
            versions.unshift({ name: 'Manual - ' + new Date().toLocaleString(), timestamp: new Date().toISOString(), data: JSON.parse(JSON.stringify(appData)) });
            if (versions.length > 20) versions.splice(20);
            localStorage.setItem('resume_versions', JSON.stringify(versions));
            loadVersions();
            showToast('Manual save created', 'success');
        }
        function clearOldVersions() {
            const versions = getVersions();
            if (versions.length <= 1) { showToast('Keeping at least 1 version', 'error'); return; }
            const keep = versions.slice(0, 3);
            localStorage.setItem('resume_versions', JSON.stringify(keep));
            loadVersions();
            showToast('Old versions cleared', 'success');
        }
        
        function startAutoSave() {
            if (autoSaveInterval) clearInterval(autoSaveInterval);
            
            autoSaveInterval = setInterval(() => {
                const timestamp = new Date().toISOString();
                const versions = getVersions();
                versions.unshift({
                    name: `Auto-save - ${new Date().toLocaleTimeString()}`,
                    timestamp: timestamp,
                    data: JSON.parse(JSON.stringify(appData))
                });
                if (versions.length > 10) versions.splice(10);
                localStorage.setItem('resume_versions', JSON.stringify(versions));
            }, 30000);
        }
        
        // Start auto-save when page loads
        startAutoSave();
        
        // 🎵 Music Toggle Functionality
        let isMusicPlaying = false;
        let musicToggleBtn;
        let bgMusic;
        
        // Initialize music after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            musicToggleBtn = document.getElementById('music-toggle');
            bgMusic = document.getElementById('bg-music');
            
            if (bgMusic) {
                bgMusic.volume = 0.3; // Keep it soft and aesthetic
                
                musicToggleBtn.addEventListener('click', () => {
                    console.log('Music button clicked, isPlaying:', isMusicPlaying);
                    
                    if (isMusicPlaying) {
                        bgMusic.pause();
                        musicToggleBtn.innerHTML = '<i class="fa-solid fa-music text-[9px]"></i><span class="text-[9px]">Music</span>';
                        musicToggleBtn.classList.remove('bg-blue-600/30', 'text-blue-400');
                        musicToggleBtn.classList.add('bg-slate-800/50');
                        console.log('Music paused');
                    } else {
                        // Try to play music with user interaction
                        const playPromise = bgMusic.play();
                        
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                console.log('Music started successfully');
                                musicToggleBtn.innerHTML = '<i class="fa-solid fa-volume-high text-[9px]"></i><span class="text-[9px]">Playing</span>';
                                musicToggleBtn.classList.remove('bg-slate-800/50');
                                musicToggleBtn.classList.add('bg-blue-600/30', 'text-blue-400');
                                
                                // Visual feedback when music starts
                                musicToggleBtn.style.transform = 'scale(1.1)';
                                setTimeout(() => {
                                    musicToggleBtn.style.transform = 'scale(1)';
                                }, 200);
                            }).catch(error => {
                                console.error('Audio play failed:', error);
                                console.log('Trying alternative audio source...');
                                
                                // Try alternative approach - create a new audio element
                                const fallbackAudio = new Audio('https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3');
                                fallbackAudio.volume = 0.3;
                                fallbackAudio.loop = true;
                                
                                fallbackAudio.play().then(() => {
                                    console.log('Fallback audio started');
                                    bgMusic = fallbackAudio;
                                    musicToggleBtn.innerHTML = '<i class="fa-solid fa-volume-high text-[9px]"></i><span class="text-[9px]">Playing</span>';
                                    musicToggleBtn.classList.remove('bg-slate-800/50');
                                    musicToggleBtn.classList.add('bg-blue-600/30', 'text-blue-400');
                                }).catch(e => {
                                    console.error('Fallback audio also failed:', e);
                                    alert('Music playback failed. Please check your browser settings.');
                                });
                            });
                        }
                    }
                    isMusicPlaying = !isMusicPlaying;
                });
            }
        });
    </script>
